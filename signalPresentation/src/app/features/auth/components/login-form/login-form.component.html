<form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
  <h1 class="login-form__title">Sign in</h1>

  @if (errorMessage) {
    <p class="login-form__error" role="alert">{{ errorMessage }}</p>
  }

  <div class="login-form__field">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="username"
      [class.login-form__input--invalid]="isFieldInvalid('email')"
    />
    @if (isFieldInvalid('email')) {
      <span class="login-form__field-error">Enter a valid email address.</span>
    }
  </div>

  <div class="login-form__field">
    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [class.login-form__input--invalid]="isFieldInvalid('password')"
    />
    @if (isFieldInvalid('password')) {
      <span class="login-form__field-error">Password must be at least 6 characters.</span>
    }
  </div>

  <button type="submit" class="login-form__submit" [disabled]="isSubmitting">
    @if (isSubmitting) {
      <span>Signing in&hellip;</span>
    } @else {
      <span>Sign in</span>
    }
  </button>
</form>
